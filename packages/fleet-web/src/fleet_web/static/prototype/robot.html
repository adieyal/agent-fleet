<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet · robot sprites</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcebf8; font: 13px/1.4 system-ui, sans-serif; color: #3d4450; }
  canvas { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; left: 12px; top: 12px; z-index: 5; background: rgba(255, 255, 255, .9);
           border: 1px solid #c9ced8; border-radius: 10px; padding: 10px 12px; width: 250px; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; }
  #panel label { display: grid; grid-template-columns: 70px 1fr; align-items: center; margin-top: 4px; }
  #panel select, #panel input[type=range] { width: 100%; }
  #stats { margin-top: 6px; font: 12px/1.35 ui-monospace, monospace; white-space: pre; }
  body.shot #panel { display: none; }
</style>
</head>
<body>
<div id="panel">
  <h1>Robot sprites</h1>
  <label>Mode <select id="mode"><option value="walk">walk the path</option><option value="pose">pose</option></select></label>
  <label>Host <select id="host"></select></label>
  <label>Kit <select id="kit"></select></label>
  <label>Face <select id="face"></select></label>
  <label>Clip <select id="clip"></select></label>
  <label>Facing <select id="dir"></select></label>
  <label>Look <select id="look"></select></label>
  <label>Zoom <input id="zoom" type="range" min="0" max="1" step="0.01"></label>
  <label><span></span><span><input id="anchors" type="checkbox"> anchors</span></label>
  <div id="stats"></div>
</div>
<canvas id="view"></canvas>
<script type="module" src="/prototype/robot.js"></script>
</body>
</html>
