<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Fleet canvas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- the deck's document reader: its type and sheet -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/canvas.css">
<link rel="stylesheet" href="/css/reader.css">
</head>
<body>
<div id="app" aria-live="off"><p class="cv-loading">Loading the canvas…</p></div>
<div id="reader" hidden>
  <div class="rd-scrim" data-close></div>
  <div class="rd-sheet" role="dialog" aria-modal="true" aria-labelledby="rdTitle" tabindex="-1" data-theme="dark">
    <div class="rd-progress"><i id="rdProgress"></i></div>
    <div class="rd-head">
      <div class="rd-id">
        <div class="rd-title"><span class="rd-kind" id="rdKind"></span><h2 id="rdTitle"></h2></div>
        <div class="rd-meta" id="rdMeta"></div>
      </div>
      <div class="rd-actions">
        <span class="rd-step" id="rdStep"><button id="rdPrev" title="Previous document (←)" aria-label="Previous document">‹</button><span id="rdPos" aria-live="polite"></span><button id="rdNext" title="Next document (→)" aria-label="Next document">›</button></span>
        <button id="rdTheme" title="Switch reading theme"></button>
        <button id="rdFull" title="Show the image fullscreen (Esc leaves)" aria-label="Show the image fullscreen" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
        <button class="rd-x" data-close title="Close (Esc)" aria-label="Close reader">✕</button>
      </div>
    </div>
    <div class="rd-body" id="rdBody"></div>
  </div>
</div>
<script type="module" src="/js/canvas/app.js"></script>
</body>
</html>
