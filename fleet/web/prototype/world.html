<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet · sprite world</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcebf8; font: 13px/1.4 system-ui, sans-serif; color: #3d4450; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #world:active { cursor: grabbing; }
  #panel { position: fixed; left: 12px; top: 12px; background: rgba(255, 255, 255, .88); border: 1px solid #c9ced8;
           border-radius: 10px; padding: 8px 12px; font: 12px/1.35 ui-monospace, monospace; white-space: pre; }
  #missing { color: #9a3b2a; }
  body.shot #panel { display: none; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="panel"><span id="stats"></span><span id="missing"></span></div>
<script type="module" src="/prototype/world.js"></script>
</body>
</html>
