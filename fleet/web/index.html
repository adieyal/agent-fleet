<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fleet Deck</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/deck.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="world" tabindex="0" aria-label="Isometric deck: projects are rooms, each android is a job; its colour and kit show the host"></canvas>
<div id="tags"></div>
<div id="floorUi"></div>
<div id="building" aria-label="The building: a floor per project, the lobby on the ground floor">
  <canvas id="buildingCanvas" aria-hidden="true"></canvas>
  <div id="buildingUi"></div>
</div>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 20 7v8l-9 5-9-5V7z" fill="none" stroke="#38bdf8" stroke-width="1.6"/><path d="M11 2v9m0 0 9-4m-9 4-9-4m9 4v9" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.2"/></svg>
    <span>FLEET</span>
  </div>
  <div class="view-toggle" id="viewToggle" role="group" aria-label="View">
    <button data-view="deck" aria-pressed="true">deck</button><button data-view="building" aria-pressed="false">building</button>
  </div>
  <button id="libraryOpen" title="Browse project documents">Library</button>
  <div class="stats" id="stats"></div>
  <div class="live" id="live"><i></i><span>connecting…</span></div>
</header>

<section class="card" id="legend">
  <button class="card-h" data-toggle="legend">Crew manifest <span>▾</span></button>
  <div class="card-b" id="legendBody"></div>
</section>

<section class="card" id="feed">
  <button class="card-h" data-toggle="feed">Deck log <span>▾</span></button>
  <div class="card-b"><ul id="feedList"></ul></div>
</section>

<div id="zoom">
  <button data-z="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button data-z="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
  <button data-z="fit" title="Fit (F)" aria-label="Fit to screen">⤢</button>
</div>

<aside id="panel" aria-hidden="true">
  <div class="ph" id="panelHead"></div>
  <div id="panelBody"></div>
</aside>

<div id="hint" hidden></div>
<div id="docTip" hidden></div>
<aside id="attnPanel" hidden role="dialog" aria-label="What needs you here"></aside>

<div id="libraryPane" hidden>
  <div class="lib-scrim" data-lib-close></div>
  <aside class="lib-sheet" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="lib-head"><h2 id="libTitle">Project library</h2><button data-lib-close aria-label="Close library">✕</button></div>
    <p class="lib-intro">Plans, decisions, and reports from configured local projects.</p>
    <input id="libSearch" type="search" placeholder="Find a document" aria-label="Find a document">
    <div id="libList" role="list"></div>
  </aside>
</div>

<div id="reader" hidden>
  <div class="rd-scrim" data-close></div>
  <div class="rd-sheet" role="dialog" aria-modal="true" aria-labelledby="rdTitle" tabindex="-1" data-theme="dark">
    <div class="rd-progress"><i id="rdProgress"></i></div>
    <div class="rd-head">
      <div class="rd-id">
        <div class="rd-title"><span class="rd-kind" id="rdKind"></span><h2 id="rdTitle"></h2></div>
        <div class="rd-meta" id="rdMeta"></div>
      </div>
      <div class="rd-actions">
        <button id="rdTheme" title="Switch reading theme"></button>
        <button id="rdCopy" title="Copy the Markdown source"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 5.5V3.6A1.1 1.1 0 0 0 9.4 2.5H3.6a1.1 1.1 0 0 0-1.1 1.1v5.8a1.1 1.1 0 0 0 1.1 1.1h1.9"/></svg><span class="lb">Copy</span></button>
        <button id="rdDownload" title="Download as .md"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8m0 0 3-3m-3 3-3-3M3 13.5h10"/></svg><span class="lb">.md</span></button>
        <button class="rd-x" data-close title="Close (Esc)" aria-label="Close reader">✕</button>
      </div>
    </div>
    <div class="rd-body" id="rdBody"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
