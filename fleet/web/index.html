<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fleet Deck</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;
  --panel:rgba(10,16,28,.82);
  --panel-solid:#0b111d;
  --line:rgba(140,170,220,.13);
  --line2:rgba(140,170,220,.26);
  --text:#e6edf8;
  --muted:#a3b2cb;
  --dim:#7384a0;
  --ok:#4ade80;
  --run:#38bdf8;
  --warn:#fbbf24;
  --bad:#f87171;
  --stall:#c084fc;
  --claude:#ff8f6b;
  --codex:#7ce7ff;
  --live:#f472b6;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --display:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Source Serif 4','Source Serif Pro',Charter,Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1400px 800px at 50% 18%,#101c33 0%,#070b14 55%,#04060b 100%)}
button{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#world.dragging{cursor:grabbing}
#world.hot{cursor:pointer}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* ---------- header */
header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,rgba(5,8,15,.94),rgba(5,8,15,.72));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.brand em{font-style:normal;font-weight:500;letter-spacing:.06em;color:var(--run);font-family:var(--mono);font-size:12px;
  padding:2px 7px;border:1px solid rgba(56,189,248,.35);border-radius:999px;background:rgba(56,189,248,.08)}
.brand svg{flex:none}
#libraryOpen{flex:none;border:1px solid var(--line2);border-radius:8px;background:rgba(56,189,248,.08);color:var(--text);
  padding:6px 10px;font:600 12px var(--sans);cursor:pointer}
#libraryOpen:hover,#libraryOpen:focus-visible{border-color:var(--run);outline:none}
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.live{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.live.demo i{background:var(--warn);box-shadow:0 0 8px var(--warn)}

/* ---------- floating cards */
.card{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;cursor:pointer;
  padding:10px 12px;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card-h span{font-family:var(--mono);letter-spacing:0;transition:transform .2s}
.card.closed .card-h span{transform:rotate(-90deg)}
.card.closed .card-b{display:none}
#legend{top:64px;left:14px;width:250px}
#legend .card-b{padding:0 8px 10px}
.crew{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:9px}
.crew:hover{background:rgba(255,255,255,.035)}
.crew canvas{width:34px;height:44px;flex:none}
.crew .who{min-width:0;flex:1}
.crew b{display:block;font:600 13px var(--mono)}
.crew small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .st{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);flex:none}
.crew.off{opacity:.5}
.crew.off .st{background:var(--bad);box-shadow:none}
.crew.off small{color:#f3a3a3}
.agents{margin:6px 6px 0;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.agents span{display:inline-flex;align-items:center;gap:6px}
.agents .visor{width:14px;height:5px;border-radius:3px;background:var(--claude);box-shadow:0 0 6px var(--claude)}
.agents .eyes{display:inline-flex;gap:3px}
.agents .eyes i{width:5px;height:5px;border-radius:50%;background:var(--codex);box-shadow:0 0 6px var(--codex)}

#feed{left:14px;bottom:14px;width:min(560px,calc(100vw - 90px))}
#feed ul{list-style:none;margin:0;padding:0 6px 8px;max-height:230px;overflow:auto;scrollbar-width:thin}
#feed li{display:flex;align-items:baseline;gap:8px;padding:4px 6px;border-radius:6px;font:13px/1.5 var(--sans);color:#d3deef;cursor:pointer;white-space:nowrap}
#feed li b{font:500 12px var(--mono)}
#feed li .s.code{font:12.5px var(--mono)}
#feed li time{font:12px var(--mono);font-variant-numeric:tabular-nums}
#feed li:hover{background:rgba(255,255,255,.04)}
#feed li.new{animation:flash 1.6s ease-out}
#feed li i{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
#feed li b{color:var(--text);font-weight:600;flex:none}
#feed li .k{color:var(--muted);flex:none;width:12px;text-align:center}
#feed li .s{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#feed li time{color:var(--dim);flex:none}
#feed li.err .s{color:#fca5a5}
#feed li.empty{color:var(--dim);cursor:default}
@keyframes flash{0%{background:rgba(56,189,248,.18)}100%{background:transparent}}

#zoom{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:20}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;
  font:600 17px var(--mono);color:var(--text);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#zoom button:hover{border-color:rgba(56,189,248,.6);color:#fff}

/* ---------- android tags */
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;cursor:pointer;will-change:transform}
.bubble{position:relative;font:500 13px/1.4 var(--sans);color:#eef4ff;background:rgba(7,12,22,.95);border:1px solid var(--hc,#38bdf8);
  padding:6px 10px;border-radius:9px;max-width:300px;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.45);overflow-wrap:anywhere}
/* the clamp sits on an inner box so a third line can't peek through the bubble's bottom padding */
.bubble .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bubble.code{font:12.5px/1.45 var(--mono)}
.bubble .ic{color:var(--hc);margin-right:5px;font-weight:600}
.bubble.quiet{color:var(--muted);border-color:var(--line2);background:rgba(7,12,22,.78)}
.bubble.bad{border-color:var(--bad);color:#fecaca}
.bubble.stall{border-color:var(--stall);color:#e9d5ff}
.bubble.done{border-color:rgba(74,222,128,.6);color:#bbf7d0}
.stack{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:rgba(5,9,17,.88);border:1px solid var(--line2)}
.stack .id{font:600 11px var(--mono);color:var(--hc);margin-right:4px}
.pip{width:8px;height:8px;border-radius:2px;border:1px solid #6b7c9c}
.pip.done{background:var(--ok);border-color:var(--ok)}
.pip.running{background:var(--run);border-color:var(--run);box-shadow:0 0 6px var(--run);animation:pulse 1.1s ease-in-out infinite}
.pip.failed{background:var(--bad);border-color:var(--bad)}
.pip.cancelled{background:#3b4558;border-color:#3b4558}
.stack b{font:600 11px var(--mono);color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--lead,0px);background:linear-gradient(var(--hc),transparent);opacity:.55;pointer-events:none}
.tag.sel .stack{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc)}
/* interactive CLI sessions: a LIVE badge and a dashed stack instead of step pips */
.tag.sess .stack{border-style:dashed}
.lv{font:700 9.5px/1 var(--sans);letter-spacing:.12em;padding:3px 5px 2px;border-radius:4px;color:#05080f;background:var(--live);margin-right:5px}
.lv.idle{background:transparent;color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}
.stack .ag{font:500 11px var(--mono);color:var(--muted)}
.bubble.wait{border-style:dashed;border-color:rgba(251,191,36,.7);color:#fde68a;background:rgba(7,12,22,.85)}
.bubble.wait .ic{color:var(--warn)}
.tag.small .bubble{display:none}
.tag.tiny{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- detail panel */
#panel{position:fixed;top:52px;right:0;bottom:0;width:420px;max-width:100vw;background:var(--panel-solid);border-left:1px solid var(--line2);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:40;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.45);will-change:transform}
#panel.open{transform:translateX(0)}
#panel .ph{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#panel .ph canvas{width:46px;height:60px;flex:none}
#panel .ph h2{margin:0;font:600 18px/1.3 var(--display)}
#panel .ph .sub{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
#close{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:8px;width:30px;height:30px;cursor:pointer;flex:none;color:var(--muted)}
#close:hover{color:#fff}
#dismiss{margin-left:auto;height:30px;padding:0 10px;background:none;border:1px solid var(--line2);border-radius:8px;cursor:pointer;flex:none;color:var(--muted);font:500 12.5px var(--sans)}
#dismiss:hover{color:#fff;border-color:var(--muted)}
#dismiss+#close{margin-left:0}
.stats .restore{cursor:pointer}
.stats .restore:hover{border-color:var(--muted)}
#panelBody{overflow:auto;padding:4px 16px 24px;flex:1;overscroll-behavior:contain;contain:content}
#panel h3{font:600 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}
.meta{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;font:13px/1.45 var(--mono);margin:0}
.meta dt{color:var(--dim)}
.meta dd{margin:0;color:var(--text);word-break:break-all}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:4px 8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.steps li .si{font:600 13px var(--mono);text-align:center}
.steps li .t{font:500 14px/1.4 var(--sans)}
.steps li .r{grid-column:2;font:13px/1.55 var(--sans);color:var(--muted);white-space:pre-wrap;word-break:break-word}
.steps li.done .si{color:var(--ok)}
.steps li.running{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.06)}
.steps li.running .si{color:var(--run)}
.steps li.failed{border-color:rgba(248,113,113,.5)}
.steps li.failed .si{color:var(--bad)}
.steps li.pending .si,.steps li.cancelled .si{color:var(--dim)}
.steps li.pending .t{color:var(--muted)}
.todos{list-style:none;margin:0;padding:0;font:13.5px/1.6 var(--sans)}
.todos li.completed{color:var(--dim);text-decoration:line-through}
.todos li.in_progress{color:var(--run)}
.evs{list-style:none;margin:0;padding:0;font:13px/1.55 var(--sans)}
.evs li{display:grid;grid-template-columns:64px 16px 1fr;gap:6px;color:#d3deef;padding:3px 0}
.evs li time{color:var(--dim);font:12px/1.7 var(--mono);font-variant-numeric:tabular-nums}
.evs li .code{font:12.5px/1.55 var(--mono)}
.evs li .k{color:var(--muted);text-align:center}
.evs li span:last-child{word-break:break-word}
.evs li.err span:last-child{color:#fca5a5}
.cmd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cmd code{flex:1;min-width:0;font:12px var(--mono);background:#060b14;border:1px solid var(--line);border-radius:8px;padding:7px 9px;overflow:auto;white-space:nowrap}
.cmd button{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:8px;padding:6px 10px;font:11.5px var(--mono);cursor:pointer;color:var(--muted)}
.cmd button:hover{color:#fff;border-color:rgba(56,189,248,.6)}
.cmd button.ok{color:var(--ok);border-color:rgba(74,222,128,.5)}
.st-running{color:var(--run)} .st-queued{color:var(--warn)} .st-done{color:var(--ok)}
.st-failed{color:var(--bad)} .st-stalled{color:var(--stall)} .st-cancelled{color:var(--dim)}
.chip.sess{border-color:rgba(244,114,182,.45);color:#fbcfe8}
.chip.sess i{background:var(--live);box-shadow:0 0 6px var(--live)}
.chip.sess.st-working i{animation:pulse 1.1s ease-in-out infinite}
.chip.sess.st-idle{border-style:dashed}
.chip.sess.st-idle i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--live)}
.untitled{color:var(--dim);font-style:italic}
.muted{color:var(--muted)}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.docs button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:1px 10px;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.docs button:hover,.docs button:focus-visible{background:rgba(255,255,255,.055);border-color:var(--hc,var(--line2));outline:none}
.docs .dn{font:500 14px/1.35 var(--sans);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs .dm{grid-column:2;font:12px/1.4 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs .go{grid-row:1/3;grid-column:3;font:500 12px var(--sans);color:var(--dim)}
.docs button:hover .go{color:var(--text)}
.dk{display:inline-grid;place-items:center;width:30px;height:34px;grid-row:1/3;border-radius:5px;font:600 13px var(--mono);
  border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--hc,#94a3b8)}
.dk.report{background:#e9edf3;color:#334155}
.dk.file{background:#0f2940;color:#7dd3fc;box-shadow:0 0 8px rgba(125,211,252,.25)}
.dk.outbox{background:#dfae55;color:#4a3208}
#docTip{position:fixed;left:0;top:0;z-index:35;pointer-events:none;max-width:320px;padding:9px 12px 10px;border-radius:10px;
  background:rgba(7,12,22,.96);border:1px solid var(--hc,var(--line2));box-shadow:0 8px 24px rgba(0,0,0,.5);font:13px/1.4 var(--sans)}
#docTip[hidden]{display:none}
#docTip .th{display:flex;align-items:baseline;gap:8px}
#docTip b{font-weight:600;color:#f2f6fc;overflow-wrap:anywhere}
#docTip .kb{flex:none;font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--hc)}
#docTip .tm{margin-top:4px;font:12px/1.45 var(--mono);color:var(--muted)}
#docTip .tc{margin-top:6px;font-size:12px;color:var(--dim)}
#libraryPane{position:fixed;inset:0;z-index:45}
#libraryPane[hidden]{display:none}
.lib-scrim{position:absolute;inset:0;background:rgba(2,5,10,.55)}
.lib-sheet{position:absolute;right:0;top:52px;bottom:0;width:min(480px,100vw);display:flex;flex-direction:column;
  background:var(--panel-solid);border-left:1px solid var(--line2);box-shadow:-16px 0 50px rgba(0,0,0,.45)}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}
.lib-head h2{margin:0;font:600 20px var(--display)}
.lib-head button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.lib-intro{margin:0 22px 16px;color:var(--muted);font:13px/1.5 var(--sans)}
#libSearch{margin:0 22px 14px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;
  background:#070d18;color:var(--text);font:13px var(--sans);outline:none}
#libSearch:focus{border-color:var(--run)}
#libList{overflow:auto;padding:0 14px 28px;scrollbar-width:thin}
.lib-group{margin:4px 8px 17px}
.lib-group h3{margin:0 0 7px;padding:8px 3px;color:var(--run);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.lib-doc{display:flex;align-items:start;gap:11px;width:100%;padding:10px 9px;border:1px solid transparent;border-radius:9px;
  background:none;text-align:left;cursor:pointer}
.lib-doc:hover,.lib-doc:focus-visible{background:rgba(255,255,255,.045);border-color:var(--line2);outline:none}
.lib-doc i{display:grid;place-items:center;flex:none;width:26px;height:30px;border-radius:4px;background:#0f2940;color:#7dd3fc;
  border-top:3px solid var(--run);font:600 13px var(--mono);font-style:normal}
.lib-doc span{min-width:0}
.lib-doc b{display:block;color:var(--text);font:500 13.5px/1.35 var(--sans)}
.lib-doc small{display:block;margin-top:3px;color:var(--dim);font:11px/1.4 var(--mono);overflow-wrap:anywhere}
.lib-empty{padding:18px 10px;color:var(--muted);font:13px/1.6 var(--sans)}
.lib-empty code{color:var(--text)}
@media(max-width:760px){.lib-sheet{top:52px;border-left:0}.stats .opt{display:none}}

#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(440px,calc(100vw - 32px));z-index:15;
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#hint h2{margin:0 0 6px;font:600 17px var(--display)}
#hint p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.5}
#hint code{font:12px var(--mono);color:var(--text);background:#060b14;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#hint a{color:var(--run)}

@media (max-width:760px){
  header{gap:10px;padding:0 12px}
  .brand em{display:none}
  .chip.opt,.chip .opt{display:none}
  .live span{display:none}
  #legend{width:auto;max-width:calc(100vw - 20px);top:60px;left:10px}
  #feed{left:10px;bottom:10px;width:calc(100vw - 72px)}
  #feed ul{max-height:120px}
  .bubble{font-size:12px;max-width:220px;padding:5px 8px}
  .bubble.code{font-size:11.5px}
  #feed li{font-size:12.5px}
  #zoom{right:10px;bottom:10px}
  #zoom button{width:40px;height:40px}
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:62vh;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;transform:translateY(104%)}
  #panel.open{transform:none}
  #panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
}
@media (prefers-reduced-motion:reduce){
  .pip.running{animation:none}
  .chip.sess.st-working i{animation:none}
  #feed li.new{animation:none}
  #panel{transition:none}
}

/* ---------- reader: a sheet over the deck, typography first */
#reader{position:fixed;inset:0;z-index:60;display:flex;justify-content:center}
#reader[hidden]{display:none}
.rd-scrim{position:absolute;inset:0;background:rgba(2,4,9,.78);animation:rdFade .2s ease-out}
.rd-sheet{position:relative;margin-top:20px;width:min(1180px,calc(100vw - 48px));height:calc(100% - 20px);display:flex;flex-direction:column;

async function loadAssets() {

    const box = new THREE.Box3().setFromObject(root);
    const norm = new THREE.Matrix4().makeScale(FS, FS, FS)
      .multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
    const parts = [];
    root.traverse(o => { if (o.isMesh) parts.push({ geometry: o.geometry, material: o.material, matrix: norm.clone().multiply(o.matrixWorld) }); });
    KIT[name] = { parts, size: box.getSize(new THREE.Vector3()).multiplyScalar(FS) };
  });

    const tpl = g.scene;

    const box = new THREE.Box3().setFromObject(tpl);
    tpl.scale.setScalar(BOT_H / (box.max.y - box.min.y));
    tpl.updateMatrixWorld(true);

      if (o.isMesh && !Array.isArray(o.material) && o.material.name === 'Main') main = o.material;

      if (!torsoMesh && isPart(o, 'Torso')) torsoMesh = o;

      headBox: new THREE.Box3().setFromObject(headMesh), torsoBox: new THREE.Box3().setFromObject(torsoMesh) };

// ------------------------------------------------------------------ documents in 3D
// Every job with documents gets a tray on its room's press, tinted by host; its documents stack in it,
// oldest at the bottom. Kind sets the shape: reports are white paper, files are dark glowing tablets,
// outbox items are amber envelopes with a seal. All sheets across the deck share three instanced meshes.
const DOC_MAX = 6;
const SHEET = {
  report: { w: 0.46, h: 0.018, d: 0.34, mat: new THREE.MeshStandardMaterial({ color: '#eef1f6', roughness: 0.7 }) },
  file:   { w: 0.4,  h: 0.04,  d: 0.3,  mat: new THREE.MeshStandardMaterial({ color: '#12304a', emissive: '#7dd3fc', emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.3 }) },
  outbox: { w: 0.46, h: 0.05,  d: 0.3,  mat: new THREE.MeshStandardMaterial({ color: '#e2b35b', roughness: 0.6 }) },
};
const FX = { print: 0.85, fly: 1.65, settle: 2.9 };  // produced-animation timeline (s)
const docGroup = new THREE.Group();
scene.add(docGroup);
let docSig = null;
const docMeshes = {};        // kind → InstancedMesh
const docSlots = {};         // kind → [{ e, doc, key, m }] in instance order
const docByKey = new Map();  // doc key → { kind, i, top: Vector3 (landing point), m }
let trayMesh = null, stripeMesh = null;
const badges = [];

function buildDocs() {
  const holders = [];
  for (const r of rooms) for (const e of r.ents) if (e.job.documents && e.job.documents.length) holders.push(e);
  const sig = holders.map(e => e.key + ':' + e.room + ':' + e.job.documents.map(d => d.id).join(',')).join('|');
  if (sig === docSig) return;
  docSig = sig;
  for (const k of Object.keys(docMeshes)) { docGroup.remove(docMeshes[k]); docMeshes[k].dispose(); delete docMeshes[k]; }
  for (const m of [trayMesh, stripeMesh]) if (m) { docGroup.remove(m); m.dispose(); }
  for (const b of badges.splice(0)) { docGroup.remove(b); b.material.map.dispose(); b.material.dispose(); }
  docByKey.clear();
  const slots = { report: [], file: [], outbox: [] }, trays = [], stripes = [];
  for (const r of rooms) {
    const mine = r.ents.filter(e => e.job.documents && e.job.documents.length);
    if (!mine.length) continue;
    const pitch = Math.min(0.62, (PRESS.y1 - 0.05 - PRESS.trays) / mine.length);
    mine.forEach((e, i) => {
      const x = r.ox + PRESS.x, z = r.oy + PRESS.trays + pitch * (i + 0.5);
      trays.push({ m: new THREE.Matrix4().compose(_v.set(x, PRESS.top + 0.025, z), _q.identity(), _sc.set(0.74, 0.05, pitch - 0.07)), c: mix(e.look.color, '#0b111d', 0.45) });
      const docs = docsOf(e.job), shown = docs.slice(-DOC_MAX), hidden = docs.length - shown.length;
      let y = PRESS.top + 0.05;
      shown.forEach(doc => {
        const kind = kindOf(doc), K = SHEET[kind], h = hash(doc.id), key = docKey(e, doc);
        const d = Math.min(K.d, pitch - 0.14);
        const pos = new THREE.Vector3(x + ((h % 7) - 3) * 0.012, y + K.h / 2, z + (((h >>> 3) % 7) - 3) * 0.008);
        const rot = new THREE.Quaternion().setFromAxisAngle(THREE.Object3D.DEFAULT_UP, (((h >>> 6) % 9) - 4) * 0.02);
        const m = new THREE.Matrix4().compose(pos, rot, new THREE.Vector3(K.w, K.h, d));
        const slot = { e, doc, key, m, kind, i: slots[kind].length };
        slots[kind].push(slot);
        docByKey.set(key, { ...slot, top: pos.clone().setY(pos.y + K.h / 2), d });
        // host stripe along the back edge; outbox envelopes also get a seal
        stripes.push({ m: new THREE.Matrix4().compose(_v.set(pos.x, pos.y + K.h / 2 + 0.004, pos.z - d / 2 + 0.035), rot, _sc.set(K.w, 0.008, 0.05)), c: e.look.color, key });
        if (kind === 'outbox') stripes.push({ m: new THREE.Matrix4().compose(_v.set(pos.x, pos.y + K.h / 2 + 0.004, pos.z + 0.03), rot, _sc.set(0.09, 0.008, 0.09)), c: '#8a5a17', key });
        y += K.h + 0.012;
      });
      if (hidden > 0) badges.push(makeBadge('+' + hidden, e.look.color, x + 0.3, y + 0.12, z));
    });
  }
  for (const kind of Object.keys(slots)) {
    const list = slots[kind];
    docSlots[kind] = list;
    if (!list.length) continue;
    const im = new THREE.InstancedMesh(G.box, SHEET[kind].mat, list.length);
    list.forEach((s, i) => im.setMatrixAt(i, s.m));
    im.castShadow = true; im.receiveShadow = true;
    im.userData.kind = kind;
    im.computeBoundingSphere();
    docMeshes[kind] = im;
    docGroup.add(im);
  }
  const inst = (list, mat, shadow) => {
    if (!list.length) return null;
    const im = new THREE.InstancedMesh(G.box, mat, list.length);
    list.forEach((it, i) => { im.setMatrixAt(i, it.m); im.setColorAt(i, _col.set(it.c)); });
    im.receiveShadow = true; im.castShadow = shadow;
    im.computeBoundingSphere();
    docGroup.add(im);
    return im;
  };
  trayMesh = inst(trays, TRAY_MAT, true);
  stripeMesh = inst(stripes, STRIPE_MAT, false);
  stripeKeys = stripes.map(s => s.key);
  stripeBase = stripes.map(s => s.m);
  for (const b of badges) docGroup.add(b);
  hoverShown = null;
  for (const key of docFx.keys()) showDoc(key, false);   // still being printed: hidden until it lands
}
const TRAY_MAT = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.3 });
const STRIPE_MAT = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
let stripeKeys = [], stripeBase = [];
function makeBadge(text, color, x, y, z) {
  const { g, c, tex } = canvasTex(96, 48);
  g.fillStyle = 'rgba(6,10,20,.94)'; rr(g, 3, 3, 90, 42, 20); g.fill();
  g.strokeStyle = color; g.lineWidth = 3; g.stroke();
  g.fillStyle = '#eef4ff'; g.font = '700 24px JetBrains Mono, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 48, 25);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, toneMapped: false, depthTest: false }));
  s.scale.set(0.36, 0.18, 1); s.position.set(x, y, z);
  return s;
}
// show, hide or lift one sheet (and its stripes) by rewriting its instance matrices
function showDoc(key, visible, lift = 0) {
  const d = docByKey.get(key);
  if (!d || !docMeshes[d.kind]) return;
  const place = m => {
    if (!visible) return _m4.makeScale(0, 0, 0);
    _m4.copy(m); if (lift) { _m4b.makeTranslation(0, lift, 0); _m4.premultiply(_m4b); }
    return _m4;
  };
  docMeshes[d.kind].setMatrixAt(d.i, place(d.m));
  docMeshes[d.kind].instanceMatrix.needsUpdate = true;
  if (stripeMesh) stripeKeys.forEach((k, i) => { if (k === key) stripeMesh.setMatrixAt(i, place(stripeBase[i])); });
  if (stripeMesh) stripeMesh.instanceMatrix.needsUpdate = true;
}
let hoverShown = null;
function liftHovered() {
  const want = hoverDoc && hoverDoc.key;
  if (want === hoverShown) return;
  if (hoverShown && !docFx.has(hoverShown)) showDoc(hoverShown, true);
  if (want && !docFx.has(want)) showDoc(want, true, 0.06);
  hoverShown = want;
}

// the printing android's beam, the sheet sliding out of the slit, its flight to the tray and a landing glow
const flyers = new Map();   // doc key → { mesh, glow }
function stepDocFx(t) {
  for (const [key, fx] of docFx) {
    const e = ents.get(fx.entKey), d = docByKey.get(key), r = e && roomByName.get(e.room);
    const ph = t - fx.start;
    if (!e || !d || !r) { dropFlyer(key); docFx.delete(key); if (d) showDoc(key, true); continue; }
    let f = flyers.get(key);
    if (ph >= 0 && ph < FX.settle && !f) {
      const mesh = new THREE.Mesh(G.box, SHEET[d.kind].mat);
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: M.failGlow.map, color: e.look.color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
      glow.visible = false;
      docGroup.add(mesh, glow);
      f = { mesh, glow };
      flyers.set(key, f);
    }
    if (!f) continue;
    const K = SHEET[d.kind], from = r.slitAt;
    if (ph < FX.print) {
      const k = ph / FX.print;
      f.mesh.visible = true;
      f.mesh.position.set(from.x, from.y, from.z + k * 0.2 - 0.1);
      f.mesh.scale.set(K.w * 0.9, K.h, 0.05 + k * K.d * 0.8);
      f.mesh.rotation.set(0, 0, 0);
      placer.setColor(r.slit, (REDUCED || Math.sin(t * 18) > -0.3) ? e.look.color : '#04070d');
      e.bot.head.getWorldPosition(_w); _w.y -= 0.3 * BK;
      dashedLine(_w, from, e.look.color, t, 0);
    } else if (ph < FX.fly) {
      placer.setColor(r.slit, '#04070d');
      const k = (ph - FX.print) / (FX.fly - FX.print), ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const x0 = from.x, y0 = from.y, z0 = from.z + 0.1;
      f.mesh.position.set(x0 + (d.top.x - x0) * ease, y0 + (d.top.y - y0) * ease + Math.sin(PI * k) * 0.55, z0 + (d.top.z - z0) * ease);
      f.mesh.rotation.set(Math.sin(k * PI * 4) * 0.35 * (1 - k), k * 0.6, 0);
      f.mesh.scale.set(K.w, K.h, d.d);
    } else {
      if (f.mesh.visible) { f.mesh.visible = false; showDoc(key, true); f.glow.visible = true; f.glow.position.copy(d.top); }
      const s = (ph - FX.fly) / (FX.settle - FX.fly);
      f.glow.scale.setScalar(0.6 + s * 0.9);
      f.glow.material.opacity = 0.9 * (1 - s);
    }
    if (ph >= FX.settle) { dropFlyer(key); docFx.delete(key); }
  }
}
function dropFlyer(key) {
  const f = flyers.get(key);
  if (!f) return;
  docGroup.remove(f.mesh, f.glow);
  f.glow.material.dispose();
  flyers.delete(key);
}

// ------------------------------------------------------------------ link lines: delegation arcs and print beams
// One line-segment buffer for the whole deck, refilled every frame; dashes march by skipping alternate segments.
const LN = 600;
const linePos = new Float32Array(LN * 6), lineCol = new Float32Array(LN * 6);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3).setUsage(THREE.DynamicDrawUsage));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3).setUsage(THREE.DynamicDrawUsage));
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, toneMapped: false }));
lines.frustumCulled = false;
scene.add(lines);
let nSeg = 0;
const _la = new THREE.Vector3(), _lb = new THREE.Vector3();
function segment(a, b) {
  if (nSeg >= LN) return;
  const o = nSeg * 6;
  linePos[o] = a.x; linePos[o + 1] = a.y; linePos[o + 2] = a.z; linePos[o + 3] = b.x; linePos[o + 4] = b.y; linePos[o + 5] = b.z;
  lineCol[o] = lineCol[o + 3] = _col.r; lineCol[o + 1] = lineCol[o + 4] = _col.g; lineCol[o + 2] = lineCol[o + 5] = _col.b;
  nSeg++;
}
// a dashed arc from a to b, lifted by `arc` in the middle

  if (a && a.kind === 'error') return [`<span class="ic">!</span>${esc(trunc(a.summary, 120))}`, 'bad'];
  if (a && a.kind === 'text') return [`<span class="ic">“</span>${esc(trunc(a.summary, 120))}`, ''];

function updateTag(e) {

      out.push(`<pre><code${lang ? ` class="language-${esc(lang)}"` : ''}>${esc(buf.join('\n'))}\n</code></pre>`);
    } else if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; }
    else if (l.startsWith('>')) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith('>')) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${mdToHtml(buf.join('\n')).html}</blockquote>`);
    } else if (l.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
      const align = cells(rows[1] || '').map(c => /^:-+:$/.test(c) ? 'center' : /-+:$/.test(c) ? 'right' : '');
      const at = k => align[k] ? ` style="text-align:${align[k]}"` : '';
      out.push(`<table><thead><tr>${cells(rows[0]).map((c, k) => `<th${at(k)}>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.slice(2).map(r => `<tr>${cells(r).map((c, k) => `<td${at(k)}>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    } else if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const buf = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) buf.push(lines[i++]);
      out.push(mdList(buf));
    } else if ((m = l.match(/^\[\^(\w+)\]:\s*(.*)$/))) { notes.push({ id: m[1], text: m[2] }); i++; }
    else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !(buf.length && starts(lines[i]))) buf.push(lines[i++].trim());
      out.push(`<p>${mdInline(buf.join(' '))}</p>`);
    }
  }
  if (notes.length) out.push(`<hr class="footnotes-sep"><section class="footnotes"><ol class="footnotes-list">${notes.map(n =>
    `<li id="fn-${esc(n.id)}" class="footnote-item"><p>${mdInline(n.text)} <a href="#fnref-${esc(n.id)}" class="footnote-backref">↩︎</a></p></li>`).join('')}</ol></section>`);
  return { html: out.join('\n'), toc };
}

  shadowDiff: `# Shadow-parse vs Textract: line-item diff

Ran the shadow parser over **60 invoices** from today’s sample (12 suppliers) and diffed every line item against the Textract baseline. 51 invoices match exactly; 9 have at least one mismatch, 23 rows in total.

> The shadow parser is ahead on credit notes and multi-page invoices, but still trails Textract on handwritten quantity corrections. Nothing here blocks the rollout to the 12 pilot restaurants.

## Summary

| Measure | Shadow parser | Textract | Δ |
|---|---:|---:|---:|
| Invoices parsed | 60 | 60 | 0 |
| Exact line-item match | 51 | 47 | +4 |
| Rows with a mismatch | 23 | 31 | −8 |
| Median latency (s) | 2.8 | 6.1 | −3.3 |
| Cost per invoice (¢) | 0.9 | 1.5 | −0.6 |

## Method

1. Pulled the sample with \`fleet-sample --date 2026-09-25 --limit 60\` and hashed every page image so both parsers saw identical input.
2. Ran both parsers with the same images and no retries.
3. Normalised supplier codes and units before comparing:
   - \`KG\`, \`kg\` and \`Kilo\` all become \`kg\`
   - pack sizes such as \`6x1L\` split into quantity and unit
4. Compared line by line on *description, quantity, unit price and line total*, with a 0.5 % tolerance on totals.

\`\`\`python
def rows_match(a: LineItem, b: LineItem, tolerance: Decimal = Decimal("0.005")) -> bool:
    if normalise(a.description) != normalise(b.description):
        return False
    if a.quantity != b.quantity:
        return False
    return abs(a.line_total - b.line_total) <= tolerance * abs(b.line_total)
\`\`\`

## Mismatches by cause

### Handwritten corrections

Seven rows. A driver crossed out the printed quantity and wrote a new one beside it; Textract read the handwriting in four of them and we read none. This is the only category where the shadow parser is clearly behind.

| Invoice | Supplier | Line | Printed | Written | Shadow | Textract |
|---|---|---|---:|---:|---:|---:|
| INV-1001 | Supplier A | Chicken thigh 2 kg | 6 | 4 | 6 | 4 |
| INV-1001 | Supplier A | Rapeseed oil 20 L | 2 | 1 | 2 | 1 |
| INV-1002 | Supplier B | Double cream 2 L | 10 | 8 | 10 | 10 |
| INV-1003 | Supplier B | Free-range eggs ×180 | 3 | 2 | 3 | 2 |
| INV-1006 | Supplier C | Lemons (box of 80) | 2 | 1 | 2 | 1 |

### Credit notes

Textract flipped negative line totals to positive in five of six credit notes. The shadow parser keeps the sign because it reads the document type before any line items[^1]. This matters more than the row count suggests: a flipped credit note overstates spend twice, once for the credit and once for the original.

### Multi-page invoices

Textract dropped the carried-forward subtotal on page two of three invoices, so its totals were short by exactly the page-one amount:

\`\`\`text
INV-1004  page 1 subtotal   £412.60   carried forward: missing
INV-1004  page 2 total      £198.35   expected £610.95
INV-1005  page 1 subtotal   £1,084.20 carried forward: missing
\`\`\`

### Unit-price rounding

Four rows differ by a penny because the supplier prints unit prices to three decimal places. Both parsers are arguably right. The relative tolerance should absorb these, and does, except for line totals under £1, where half a percent is less than a penny.

## What I changed

- Added \`luc_tolerance_abs = Decimal("0.01")\` alongside the relative tolerance, and a test for a £0.84 line.
- Kept document-type detection ahead of line parsing, with a regression test for each of the six credit notes.
- Did **not** touch handwriting: that needs a model change, not a rule, and belongs in its own job.

- [ ] Taxonomy update drafted (next step)

1. Should handwritten corrections be *flagged for review* rather than parsed? A flag is cheap and safe; parsing them wrong is expensive.
2. When printed and written quantities disagree and there is no delivery note, which one do we trust?
3. Is a penny of rounding worth surfacing to the restaurant at all, or should it be silently absorbed?

---

    if (job.events.length > 15) job.events.splice(0, job.events.length - 15);
    job.updated_at = now();
    if (e.kind === 'tool' || e.kind === 'text' || e.kind === 'error') job.activity = job.events[job.events.length - 1];
  }
  function tick() {
    tickCount++;
    if (tickCount === 3) { addDoc(deck, 'file-0', 'file', 'docs/deck-layout.md', 2, DEMO_DOCS.deckLayout); push(deck, { kind: 'tool', tool: 'edit', summary: 'docs/deck-layout.md' }); }
    if (tickCount === 7) addDoc(flaky, 'outbox-root-cause.md', 'outbox', 'root-cause.md', null, DEMO_DOCS.rootCause);
    for (const job of jobs) {
      job.ticks++;
      if (job.status === 'queued' && job.ticks > 7) {
        job.status = 'running'; job.steps[0].status = 'running'; job.steps[0].started_at = now(); newTodos(job);
        push(job, { kind: 'step', status: 'running', summary: job.steps[0].title });
        continue;
      }
      if (job.status === 'done' && job.ticks > 16) {   // re-queued: idles in the lounge for a while, then starts over
        job.steps.forEach(s => { s.status = 'pending'; s.result = null; });
        job.status = 'queued'; job.ticks = 0;
        push(job, { kind: 'job', status: 'queued', summary: `${job.steps.length} step(s) re-queued` });
        continue;
      }
      if (job.status !== 'running') continue;
      const i = jobs.indexOf(job);
      if (PINS) {
        const seq = PINS[i % PINS.length].split('+'), act = seq[Math.floor(tickCount / 5) % seq.length];   // type+ship: alternate every 10 s
        // a pinned test run alternates with its outcome: an error half the time, otherwise the next command
        if (act === 'test' && job.tested) push(job, rand() < 0.5 ? { kind: 'error', summary: 'exit 1: pytest -q (2 failed, 41 passed)' } : { kind: 'tool', tool: 'bash', name: 'Bash', summary: 'git add -A' });
        else push(job, pinned(act));
        job.tested = act === 'test' && !job.tested;
        continue;
      }
      // a test run is followed by its outcome: sometimes a failure, otherwise the agent simply carries on
      if (job.tested) {
        job.tested = false;
        if (rand() < 0.35) { push(job, { kind: 'error', summary: 'exit 1: 2 failed, 41 passed' }); continue; }
      }
      if (rand() < 0.55) {
        const tool = pickTool();
        const sameRoom = jobs.some(o => o !== job && o.project === job.project);
        const kind = tool === 'delegate' && !sameRoom ? 'read' : tool;
        if (kind === 'think' && rand() < 0.4) push(job, { kind: 'text', summary: pick(SUMMARIES.think) });
        else push(job, demoTool(kind));
        job.tested = activityOf(job.activity) === 'test';
      }
      if (rand() < 0.3 && job.todos.length) {
        const i = job.todos.findIndex(td => td.status !== 'completed');
        if (i >= 0) { job.todos[i].status = 'completed'; if (job.todos[i + 1]) job.todos[i + 1].status = 'in_progress'; }
      }
      if (rand() < 0.08) {
        const i = job.steps.findIndex(s => s.status === 'running');
        if (i < 0) continue;
        job.steps[i].status = 'done'; job.steps[i].finished_at = now(); job.steps[i].result = pick(RESULTS);
        addReport(job, i);
        push(job, { kind: 'step', status: 'done', summary: job.steps[i].result });
        if (job.steps[i + 1]) { job.steps[i + 1].status = 'running'; job.steps[i + 1].started_at = now(); newTodos(job); push(job, { kind: 'step', status: 'running', summary: job.steps[i + 1].title }); }
        else { job.status = 'done'; job.ticks = 0; job.todos = []; push(job, { kind: 'job', status: 'done', summary: 'job done' }); }
      }
    }
    for (const s of sessions) {
      if (s.status !== 'working' || rand() > 0.5) continue;
      const tool = pickTool();
      s.events.push(tool === 'think' && rand() < 0.4 ? { kind: 'text', summary: pick(SUMMARIES.think), ts: now() }
        : { ...demoTool(tool === 'delegate' ? 'read' : tool), ts: now() });
      if (s.events.length > 15) s.events.splice(0, s.events.length - 15);
      s.activity = s.events[s.events.length - 1];
      s.updated_at = now();
    }
    const doc = { time: now(), hosts: [
      ...['node-a', 'node-b', 'node-c'].map(name => ({ name, ok: true, error: null, jobs: jobs.filter(j => j.host === name),
        sessions: sessions.filter(s => s.host === name) })),
      { name: 'node-d', ok: false, error: 'node-d: ssh: connect to host 192.0.2.10 port 22: Connection timed out', jobs: [] },
    ] };
    return JSON.parse(JSON.stringify(doc));
  }
  return tick;
}

// ------------------------------------------------------------------ boot
resize();
loadAssets().then(() => {
  resize();
  layoutRooms([]);
  if (DEBUG && QS.get('cam')) {   // ?debug&cam=x,z,zoom: look at one spot, for close-up screenshots
    const [x, z, zoom] = QS.get('cam').split(',').map(Number);
    cam.z = zoom || 60; cam.c.set(x, 0.7, z); cam.userMoved = true;
  }
  if (DEBUG && QS.has('hoverdoc')) {   // ?debug&hoverdoc=S: after S seconds, hover a 3D document through the raycast path
    setTimeout(() => {
      const all = Object.values(docSlots).flat();
      const slot = all.find(s => /Diff line items/.test(s.doc.name)) || all[0];
      if (!slot) { console.error('hoverdoc: no documents on the deck'); return; }
      _w.setFromMatrixPosition(slot.m); _w.y += 0.01;
      const at = toScreen(_w, { x: 0, y: 0 });
      canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: at.x, clientY: at.y, pointerId: 99, pointerType: 'mouse', bubbles: true }));
    }, Number(QS.get('hoverdoc')) * 1000 || 5000);
  }
  if (DEBUG && QS.has('clickbot')) {   // ?debug&clickbot=S: click the first running android through the raycast path
    setTimeout(() => {
      const e = [...ents.values()].find(x => x.job.status === 'running') || ents.values().next().value;
      if (!e) { console.error('clickbot: no androids on the deck'); return; }
      e.bot.head.getWorldPosition(_w);
      const at = toScreen(_w, { x: 0, y: 0 });
      const opts = { clientX: at.x, clientY: at.y, pointerId: 98, pointerType: 'mouse', bubbles: true };
      canvas.dispatchEvent(new PointerEvent('pointerdown', opts)); canvas.dispatchEvent(new PointerEvent('pointerup', opts));
    }, Number(QS.get('clickbot')) * 1000 || 5000);
  }
  if (DEBUG && QS.has('bots')) {  // ?debug&bots: large portraits of every android variant
    const wrap = document.body.appendChild(Object.assign(document.createElement('div'), { style: 'position:fixed;left:280px;top:70px;z-index:98;display:flex;flex-wrap:wrap;gap:8px;background:#0b111d;padding:8px' }));
    for (const [host, agent, pose] of [['node-a', 'claude'], ['node-b', 'codex'], ['node-c', 'claude'], ['node-d', 'codex'], ['node-a', 'codex', 'off']]) {
      const cv = wrap.appendChild(Object.assign(document.createElement('canvas'), { style: 'width:200px;height:260px;background:#1a2336' }));
      miniBot(cv, hostLook(host), agent, pose || 'normal');
    }
  }
  if (DEMO) {
    const tick = demoSource();
    applyState(tick());
    setInterval(() => applyState(tick()), POLL_MS);
  } else {
    stream();
  }
  setInterval(renderLive, 1000);
  requestAnimationFrame(frame);
}, err => {
  const hint = document.getElementById('hint');
  hint.hidden = false;
  hint.innerHTML = `<h2>The deck couldn’t load its 3D assets</h2><p><code>${esc(err.message || String(err))}</code></p><p>They are served from <code>/vendor/</code> and <code>/assets/</code> by <code>fleet web</code>.</p>`;
  console.error(err);
});
})();
</script>
