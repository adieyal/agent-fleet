[project]
name = "agent-fleet"
version = "0.1.0"
description = "Run, monitor and orchestrate Claude Code and Codex agents across machines over ssh"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fleet==0.1.0", "fleet-cli==0.1.0", "fleet-web==0.1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fleet = { workspace = true }
fleet-cli = { workspace = true }
fleet-web = { workspace = true }

[dependency-groups]
# Browser tests need Chromium for the locked playwright: uv run playwright install chromium
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "pytest-playwright>=0.5",
    "playwright>=1.44",
    "pillow>=12.3.0",
    "numpy>=2.2.6",
]


[tool.pytest.ini_options]
pythonpath = ["."]
