[project]
name = "agent-fleet"
version = "0.1.0"
description = "Run, monitor and orchestrate Claude Code and Codex agents across machines over ssh"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["rich>=13", "markdown-it-py>=3", "mdit-py-plugins>=0.4"]

[dependency-groups]
# playwright is pinned to the release whose Chromium (build 1117) is cached locally
dev = ["pytest>=8", "pytest-playwright>=0.5", "playwright==1.44.0"]

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet"]
